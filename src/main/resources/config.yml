settings:
  movement-tolerance: BALANCED
  runtime-sampler-interval-ticks: 2
  transaction-interval-ticks: 20
  stale-transaction-ms: 10000
  max-pending-transactions: 20
  verbose-default: false
  lag:
    tps-threshold: 18.5
  alerts:
    permission: poseidon.alerts
    console: true
    cooldown-ms: 250
  flag-log:
    enabled: true
    file: flags.jsonl
    flush-interval-ticks: 20
    max-lines-per-flush: 256
    max-bytes: 10485760
    max-backups: 3
  violation-decay:
    enabled: true
    interval-ticks: 20
    amount: 0.15

cloud:
  enabled: false
  instance-id: hcf-1
  endpoint-url: ""
  api-key: ""
  timeout-ms: 1500
  spool-file: cloud-signals.jsonl
  flush-interval-ticks: 40
  max-lines-per-flush: 512
  max-posts-per-flush: 2
  max-spool-bytes: 10485760
  max-spool-backups: 2
  cross-instance:
    enabled: false
    reputation-file: cross-instance-reputation.jsonl
    flush-interval-ticks: 40
    max-lines-per-flush: 512
    import-interval-ticks: 100
    max-record-age-ms: 86400000
    local-weight: 1.0
    remote-weight: 0.75
    minimum-risk: 10.0
    max-file-bytes: 10485760
    max-backups: 2

exemptions:
  join-ms: 3000
  teleport-ms: 2000
  respawn-ms: 3000
  damage-ms: 350
  block-place-ms: 300
  block-break-ms: 300
  high-transaction-ping-ms: 350

mitigations:
  enabled: true
  mode: monitor
  interval-ticks: 20
  decay-per-second: 0.75
  duration-ms: 30000
  cross-instance-weight: 0.40
  thresholds:
    light: 8.0
    medium: 16.0
    heavy: 28.0
  weights:
    movement: 1.20
    combat: 1.00
    inventory: 0.90
    world: 1.10
    packet: 0.80
    timing: 1.10
    latency: 0.65
    behavior: 1.75
  actions:
    combat-damage-scale:
      light: 0.95
      medium: 0.75
      heavy: 0.0
    combat-range-limit:
      light: 3.15
      medium: 2.95
      heavy: 2.70
    cancel-inventory-at: MEDIUM
    cancel-world-at: HEAVY
    movement-setback-heavy: false
    setback-cooldown-ms: 1500

model:
  enabled: true
  interval-ticks: 20
  decay-per-second: 0.55
  bias: 7.5
  scale: 16.0
  weights:
    movement: 1.20
    combat: 1.35
    inventory: 0.95
    world: 1.15
    packet: 0.80
    timing: 1.10
    latency: 0.80
    behavior: 1.60

replay:
  enabled: false
  file: replay-sessions.jsonl
  flush-interval-ticks: 40
  max-lines-per-flush: 512
  max-bytes: 20971520
  max-backups: 2

punishments:
  enabled: false
  allow-experimental: false
  command-cooldown-ms: 300000
  require-recent:
    flags: 3
    window-ms: 60000
    max-stored: 12
  default-actions:
    - "alert"
    - "log"
    - "staff-debug"
  default-commands:
    - "kick {player} Poseidon detected {check} ({type}) VL {vl}"

profiles:
  default: monitor
  monitor:
    punish: false
    mitigations-mode: monitor
  staff-test:
    punish: false
    mitigations-mode: staff-test
  production-safe:
    punish: false
    mitigations-mode: production
  aggressive-test:
    punish: false
    mitigations-mode: production

